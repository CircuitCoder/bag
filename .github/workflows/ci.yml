name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Validate workspace
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            rm -f bag-serve/db.sqlite
            mapfile -t migrations < <(printf "%s\n" bag-serve/migrations/*.sql | sort -V)
            for migration in "${migrations[@]}"; do
              sqlite3 bag-serve/db.sqlite < "$migration"
            done
            export DATABASE_URL="sqlite:${{ github.workspace }}/bag-serve/db.sqlite"
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo build --workspace
            cargo test --workspace
          '

      - name: Upload SQLx database artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlx-db
          path: bag-serve/db.sqlite

  build-bag-serve:
    name: Build bag-serve (${{ matrix.arch }}, dynamic)
    needs: test
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Download SQLx database artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: sqlx-db
          path: bag-serve

      - name: Build bag-serve
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            export DATABASE_URL="sqlite:${{ github.workspace }}/bag-serve/db.sqlite"
            cargo build -p bag-serve --release --target "${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/bag-serve" "bag-serve-${{ matrix.arch }}-dynamic"
          '

      - name: Upload bag-serve artifact
        uses: actions/upload-artifact@v4
        with:
          name: bag-serve-${{ matrix.arch }}-dynamic
          path: bag-serve-${{ matrix.arch }}-dynamic

  build-web:
    name: Build bag-web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Build web frontend
        run: |
          nix develop --command bash -lc 'cd bag-web && env -u NO_COLOR trunk build --release --locked --public-url "./"'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bag-web/dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [test, build-bag-serve, build-web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
