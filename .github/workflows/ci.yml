name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Validate workspace
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            rm -f bag-serve/db.sqlite
            mapfile -t migrations < <(printf "%s\n" bag-serve/migrations/*.sql | sort -V)
            for migration in "${migrations[@]}"; do
              sqlite3 bag-serve/db.sqlite < "$migration"
            done
            export DATABASE_URL="sqlite:${{ github.workspace }}/bag-serve/db.sqlite"
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo build --workspace
            cargo test --workspace
          '

      - name: Upload SQLx database artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlx-db
          path: bag-serve/db.sqlite

  build-bag-serve:
    name: Build bag-serve (${{ matrix.arch }}, ${{ matrix.linkage }})
    needs: test
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_32
            target: i686-unknown-linux-gnu
            linkage: dynamic
            rustflags: ""
            use_i686_cross: true
            runs_on: ubuntu-latest
          - arch: x86_32
            target: i686-unknown-linux-gnu
            linkage: static
            rustflags: -C target-feature=+crt-static
            use_i686_cross: true
            runs_on: ubuntu-latest
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            linkage: dynamic
            rustflags: ""
            use_i686_cross: false
            runs_on: ubuntu-latest
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            linkage: static
            rustflags: -C target-feature=+crt-static
            use_i686_cross: false
            runs_on: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            linkage: dynamic
            rustflags: ""
            use_i686_cross: false
            runs_on: ubuntu-24.04-arm
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            linkage: static
            rustflags: -C target-feature=+crt-static
            use_i686_cross: false
            runs_on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Install i686 cross toolchain dependencies
        if: ${{ matrix.use_i686_cross }}
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-i686-linux-gnu \
            libc6-dev-i386 \
            libavcodec-dev:i386 \
            libavdevice-dev:i386 \
            libavfilter-dev:i386 \
            libavformat-dev:i386 \
            libavutil-dev:i386 \
            libsqlite3-dev:i386 \
            libswresample-dev:i386 \
            libswscale-dev:i386 \
            pkg-config

      - name: Download SQLx database artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: sqlx-db
          path: bag-serve

      - name: Build bag-serve
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            export DATABASE_URL="sqlite:${{ github.workspace }}/bag-serve/db.sqlite"
            if [ "${{ matrix.arch }}" = "x86_32" ]; then
              export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=i686-linux-gnu-gcc
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_LIBDIR_i686_unknown_linux_gnu=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
            fi
            export RUSTFLAGS="${{ matrix.rustflags }}"
            cargo build -p bag-serve --release --target "${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/bag-serve" "bag-serve-${{ matrix.arch }}-${{ matrix.linkage }}"
          '

      - name: Upload bag-serve artifact
        uses: actions/upload-artifact@v4
        with:
          name: bag-serve-${{ matrix.arch }}-${{ matrix.linkage }}
          path: bag-serve-${{ matrix.arch }}-${{ matrix.linkage }}

  build-web:
    name: Build bag-web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Build web frontend
        run: |
          nix develop --command bash -lc 'cd bag-web && env -u NO_COLOR trunk build --release --locked --public-url "./"'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bag-web/dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [test, build-bag-serve, build-web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
