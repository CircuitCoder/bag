name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ffmpeg \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config \
            sqlite3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare SQLx database
        run: |
          rm -f bag-serve/db.sqlite
          for migration in bag-serve/migrations/*.sql; do
            sqlite3 bag-serve/db.sqlite < "$migration"
          done

      - name: Run tests
        env:
          DATABASE_URL: sqlite:${{ github.workspace }}/bag-serve/db.sqlite
        run: cargo test --workspace

  build-bag-serve:
    name: Build bag-serve (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            target: i686-unknown-linux-gnu
            runs_on: ubuntu-latest
            cross_i686: true
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-latest
            cross_i686: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm
            cross_i686: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install amd64/aarch64 system dependencies
        if: ${{ !matrix.cross_i686 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ffmpeg \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libsqlite3-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config \
            sqlite3

      - name: Install i686 cross dependencies
        if: ${{ matrix.cross_i686 }}
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ffmpeg \
            gcc-i686-linux-gnu \
            libavcodec-dev:i386 \
            libavdevice-dev:i386 \
            libavfilter-dev:i386 \
            libavformat-dev:i386 \
            libavutil-dev:i386 \
            libsqlite3-dev:i386 \
            libswresample-dev:i386 \
            libswscale-dev:i386 \
            pkg-config \
            sqlite3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare SQLx database
        run: |
          rm -f bag-serve/db.sqlite
          for migration in bag-serve/migrations/*.sql; do
            sqlite3 bag-serve/db.sqlite < "$migration"
          done

      - name: Build bag-serve
        env:
          DATABASE_URL: sqlite:${{ github.workspace }}/bag-serve/db.sqlite
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: i686-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: cargo build -p bag-serve --release --target ${{ matrix.target }}

      - name: Upload bag-serve artifact
        uses: actions/upload-artifact@v4
        with:
          name: bag-serve-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bag-serve

  build-web:
    name: Build bag-web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk and wasm-bindgen-cli
        run: |
          cargo install --locked trunk --version 0.21.14
          cargo install --locked wasm-bindgen-cli --version 0.2.125

      - name: Build web frontend
        run: |
          cd bag-web
          env -u NO_COLOR trunk build --release --locked index.html --public-url "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bag-web/dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
