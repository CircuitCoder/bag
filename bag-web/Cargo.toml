[package]
name = "bag-web"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.19", features = ["csr"] }
leptos_router = "0.8.13"
serde = "1.0"
serde_json = "1.0.150"
web-sys = { version = "0.3", features = ["Window", "Storage", 'Headers', 'Request', 'RequestInit', 'RequestMode', 'Response'] }
bag-lib = { path = "../bag-lib" }
mime_guess = { version = "2.0.5", default-features = false }
