[package]
name = "bag-serve"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = { workspace = true, features = ["http2"] }
tower-http = { version = "0.5", features = ["cors", "compression-br"] }
bag-fs = { path = "../bag-fs" }
bag-lib = { path = "../bag-lib" }
anyhow = "1.0.102"
sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite-unbundled", "chrono" ] }
chrono = "0.4.45"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = { workspace = true }
tracing-indicatif = "0.3.14"
indicatif = "0.18.4"
mime_guess = { version = "2.0.5", default-features = false }
inotify = "0.11.2"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.23.0"
zip = "8.6.0"
